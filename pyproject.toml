[project]
name = "kirby-world"
version = "0.1.0"
description = "Places for the Kirby HERO System platform: Worlds, Scenes and the geometry inside them"
requires-python = ">=3.12"
license = {text = "PolyForm Noncommercial License 1.0.0"}
readme = "README.md"
authors = [{name = "PeterB"}]
# One dependency, and it is a leaf: kirby-terrain owns the 6E2 p173 Objects
# Table a Furnishing's durability is read from. Nothing here imports the fight
# engine; the fight imports this.
dependencies = ["kirby-terrain>=0.1.0"]

[project.urls]
Repository = "https://github.com/pdbethke/kirby-world"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kirby_world*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
